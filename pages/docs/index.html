<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="김해찬의 Markdown 지식 아카이브">
  <meta name="theme-color" content="#46a758">
  <title>김해찬 · Docs</title>
  <link rel="icon" type="image/svg+xml" href="../assets/favicon.svg">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/site.js" defer></script>
  <script src="../assets/docs.js" defer></script>
</head>
<body class="docs-body">
  <a class="skip-link" href="#doc-article">본문으로 바로가기</a>
  <header class="site-header docs-header">
    <div class="header-inner">
      <a class="brand" href="../" aria-label="김해찬 홈"><span class="brand-mark" aria-hidden="true">H</span><span>김해찬</span></a>
      <button class="nav-toggle" type="button" aria-label="메뉴 열기" aria-expanded="false">메뉴</button>
      <nav class="main-nav" aria-label="주요 메뉴"><a href="../">Home</a><a href="../about/">About</a><a class="active" href="./">Docs</a></nav>
      <button class="theme-toggle" type="button" aria-label="색상 모드 전환"><span aria-hidden="true">◐</span></button>
    </div>
  </header>

  <div class="docs-toolbar">
    <button id="sidebarToggle" class="sidebar-toggle" type="button" aria-controls="docsSidebar" aria-expanded="false">문서 목록</button>
    <label class="search-box" for="docSearch"><span aria-hidden="true">⌕</span><span class="sr-only">문서 검색</span><input id="docSearch" type="search" placeholder="문서 제목과 태그 검색" autocomplete="off"></label>
    <p id="docCount" class="doc-count" aria-live="polite"></p>
  </div>

  <main class="docs-layout">
    <aside id="docsSidebar" class="docs-sidebar" aria-label="문서 분류">
      <div class="sidebar-heading"><strong>분류</strong><button id="closeSidebar" type="button" aria-label="문서 목록 닫기">×</button></div>
      <nav id="categoryTree" class="category-tree"></nav>
      <div class="sidebar-meta"><span class="status-dot" aria-hidden="true"></span>Markdown archive</div>
    </aside>

    <article id="doc-article" class="wiki-article" tabindex="-1" aria-live="polite">
      <div class="loading-state">문서를 불러오는 중입니다.</div>
    </article>

    <aside class="toc-panel" aria-label="이 문서의 목차">
      <p>목차</p>
      <nav id="tableOfContents"></nav>
    </aside>
  </main>
  <div id="sidebarBackdrop" class="sidebar-backdrop" hidden></div>
</body>
</html>
